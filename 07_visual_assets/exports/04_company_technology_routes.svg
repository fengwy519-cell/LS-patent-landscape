<text x="1465" y="815" font-size="24" font-weight="650" fill="#243B53" text-anchor="start" dominant-baseline="hanging" opacity="1"><tspan x="1465" dy="0">多路同步 /</tspan><tspan x="1465" dy="36">数字解调</tspan></text>
<text x="72" y="948" font-size="21" font-weight="400" fill="#627D98" text-anchor="start" dominant-baseline="middle" opacity="1" class="">路线阶段相互重叠；数量不用于推导技术领先性。</text></svg>