  </defs><rect x="0" y="0" width="1800" height="980" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/><text x="72" y="64" font-size="42" font-weight="700" fill="#102A43" text-anchor="start" dominant-baseline="middle" opacity="1" class="">四家主要厂商：同源基础，不同长期技术重心</text>
<text x="72" y="116" font-size="24" font-weight="400" fill="#627D98" text-anchor="start" dominant-baseline="middle" opacity="1" class="">每条路线仅保留冻结结论中的 3–4 个主阶段</text>
