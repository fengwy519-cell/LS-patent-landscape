<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Source Han Sans SC",sans-serif}</style><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="64" y="55" width="8" height="45" fill="#2166A5"/><text x="92" y="86" font-size="38" font-weight="700" fill="#15324F"><tspan x="92" dy="0">关键采购风险集中在紫外照明、精密光学与定制光栅</tspan></text><text x="64" y="143" font-size="24" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">稳定交付取决于定制精度、批次一致性、迭代周期，以及换源后的系统重验证。</tspan></text><text x="1470" y="867" font-size="18" font-weight="400" fill="#586B7A"><tspan x="1470" dy="0">02</tspan></text><text x="64" y="202" font-size="21" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">功能类别汇总；候选不是已认证供应商，具体器件按架构选用。</tspan></text><rect x="64" y="231" width="1472" height="50" fill="#15324F"/><text x="76" y="264" font-size="22" font-weight="700" fill="#FFFFFF"><tspan x="76" dy="0">类别</tspan></text><text x="271" y="264" font-size="22" font-weight="700" fill="#FFFFFF"><tspan x="271" dy="0">核心要求</tspan></text><text x="511" y="264" font-size="22" font-weight="700" fill="#FFFFFF"><tspan x="511" dy="0">代表候选</tspan></text><text x="831" y="264" font-size="22" font-weight="700" fill="#FFFFFF"><tspan x="831" dy="0">当前供应状态</tspan></text><text x="1061" y="264" font-size="22" font-weight="700" fill="#FFFFFF"><tspan x="1061" dy="0">主要风险</tspan></text><text x="1431" y="264" font-size="22" font-weight="700" fill="#FFFFFF"><tspan x="1431" dy="0">风险</tspan></text><rect x="64" y="281" width="1472" height="88" fill="#F4F7FA"/><rect x="64" y="281" width="5" height="88" fill="#A54719"/><text x="76" y="317" font-size="21" font-weight="700" fill="#15324F"><tspan x="76" dy="0">UV/DUV 照明</tspan></text><text x="271" y="317" font-size="21" font-weight="400" fill="#243746"><tspan x="271" dy="0">有效光谱亮度</tspan><tspan x="271" dy="26.88">稳定性、耦合、寿命</tspan></text><text x="511" y="316" font-size="20" font-weight="400" fill="#243746"><tspan x="511" dy="0">Energetiq / Hamamatsu</tspan><tspan x="511" dy="25.6">卓立汉光：系统候选</tspan></text><text x="831" y="317" font-size="21" font-weight="400" fill="#243746"><tspan x="831" dy="0">商用品存在</tspan><tspan x="831" dy="26.88">系统适配待验证</tspan></text><text x="1061" y="317" font-size="21" font-weight="400" fill="#243746"><tspan x="1061" dy="0">光预算、长期漂移</tspan><tspan x="1061" dy="26.88">换源重标定</tspan></text><text x="1430" y="316" font-size="23" font-weight="700" fill="#A54719"><tspan x="1430" dy="0">高</tspan></text><text x="1425" y="346" font-size="16" font-weight="400" fill="#586B7A"><tspan x="1425" dy="0">高亮度分支</tspan></text><rect x="64" y="368" width="1472" height="1" fill="#D7E0E8"/><rect x="64" y="369" width="1472" height="88" fill="#FFFFFF"/><rect x="64" y="369" width="5" height="88" fill="#A54719"/><text x="76" y="405" font-size="21" font-weight="700" fill="#15324F"><tspan x="76" dy="0">精密光学</tspan><tspan x="76" dy="26.88">+ UV 镀膜</tspan></text><text x="271" y="405" font-size="21" font-weight="400" fill="#243746"><tspan x="271" dy="0">面形、散射、基准</tspan><tspan x="271" dy="26.88">镀后及装配稳定</tspan></text><text x="511" y="404" font-size="20" font-weight="400" fill="#243746"><tspan x="511" dy="0">ZYGO / CASTECH</tspan><tspan x="511" dy="25.6">等定制候选</tspan></text><text x="831" y="405" font-size="21" font-weight="400" fill="#243746"><tspan x="831" dy="0">国内外有候选</tspan><tspan x="831" dy="26.88">组合精度待验证</tspan></text><text x="1061" y="405" font-size="21" font-weight="400" fill="#243746"><tspan x="1061" dy="0">加工—镀膜—检测—装调</tspan><tspan x="1061" dy="26.88">返工影响研发排期</tspan></text><text x="1430" y="404" font-size="23" font-weight="700" fill="#A54719"><tspan x="1430" dy="0">高</tspan></text><text x="1425" y="434" font-size="16" font-weight="400" fill="#586B7A"><tspan x="1425" dy="0">定制组合</tspan></text><rect x="64" y="456" width="1472" height="1" fill="#D7E0E8"/><rect x="64" y="457" width="1472" height="88" fill="#F4F7FA"/><rect x="64" y="457" width="5" height="88" fill="#A54719"/><text x="76" y="493" font-size="21" font-weight="700" fill="#15324F"><tspan x="76" dy="0">多区域</tspan><tspan x="76" dy="26.88">精密光栅</tspan></text><text x="271" y="493" font-size="21" font-weight="400" fill="#243746"><tspan x="271" dy="0">周期、占空比、位置</tspan><tspan x="271" dy="26.88">缺陷与全幅一致性</tspan></text><text x="511" y="492" font-size="20" font-weight="400" fill="#243746"><tspan x="511" dy="0">APPLIED IMAGE / 清溢</tspan><tspan x="511" dy="25.6">功能首件尚待确认</tspan></text><text x="831" y="493" font-size="21" font-weight="400" fill="#243746"><tspan x="831" dy="0">有加工路线</tspan><tspan x="831" dy="26.88">功能验收待完成</tspan></text><text x="1061" y="493" font-size="21" font-weight="400" fill="#243746"><tspan x="1061" dy="0">母版、全幅与批次响应</tspan><tspan x="1061" dy="26.88">换厂后重新标定</tspan></text><text x="1430" y="492" font-size="23" font-weight="700" fill="#A54719"><tspan x="1430" dy="0">高</tspan></text><text x="1425" y="522" font-size="16" font-weight="400" fill="#586B7A"><tspan x="1425" dy="0">多区域定制</tspan></text><rect x="64" y="544" width="1472" height="1" fill="#D7E0E8"/><rect x="64" y="545" width="1472" height="88" fill="#FFFFFF"/><rect x="64" y="545" width="5" height="88" fill="#956522"/><text x="76" y="581" font-size="21" font-weight="700" fill="#15324F"><tspan x="76" dy="0">UV 探测</tspan><tspan x="76" dy="26.88">与电子学</tspan></text><text x="271" y="581" font-size="21" font-weight="400" fill="#243746"><tspan x="271" dy="0">UV响应、低噪声</tspan><tspan x="271" dy="26.88">多通道同步</tspan></text><text x="511" y="580" font-size="20" font-weight="400" fill="#243746"><tspan x="511" dy="0">Hamamatsu / TI / ADI</tspan><tspan x="511" dy="25.6">Gpixel：阵列技术候选</tspan></text><text x="831" y="581" font-size="21" font-weight="400" fill="#243746"><tspan x="831" dy="0">通用电子成熟</tspan><tspan x="831" dy="26.88">UV专用供货待核</tspan></text><text x="1061" y="581" font-size="21" font-weight="400" fill="#243746"><tspan x="1061" dy="0">封装与专用品适配</tspan><tspan x="1061" dy="26.88">阵列仅在选定架构使用</tspan></text><text x="1430" y="580" font-size="23" font-weight="700" fill="#956522"><tspan x="1430" dy="0">中–高</tspan></text><text x="1425" y="610" font-size="16" font-weight="400" fill="#586B7A"><tspan x="1425" dy="0">通用中</tspan><tspan x="1425" dy="20.48">阵列高</tspan></text><rect x="64" y="632" width="1472" height="1" fill="#D7E0E8"/><rect x="64" y="633" width="1472" height="88" fill="#F4F7FA"/><rect x="64" y="633" width="5" height="88" fill="#956522"/><text x="76" y="669" font-size="21" font-weight="700" fill="#15324F"><tspan x="76" dy="0">特殊分光 / 偏振</tspan><tspan x="76" dy="26.88">光纤 / 精密结构</tspan></text><text x="271" y="669" font-size="21" font-weight="400" fill="#243746"><tspan x="271" dy="0">波段、偏振、杂光</tspan><tspan x="271" dy="26.88">热稳与机械稳定</tspan></text><text x="511" y="668" font-size="20" font-weight="400" fill="#243746"><tspan x="511" dy="0">CASTECH / Thorlabs等</tspan><tspan x="511" dy="25.6">结构件按图纸评审</tspan></text><text x="831" y="669" font-size="21" font-weight="400" fill="#243746"><tspan x="831" dy="0">有加工基础</tspan><tspan x="831" dy="26.88">组合性能待验证</tspan></text><text x="1061" y="669" font-size="21" font-weight="400" fill="#243746"><tspan x="1061" dy="0">多参数组合降低替代性</tspan><tspan x="1061" dy="26.88">精密基准需装机复验</tspan></text><text x="1430" y="668" font-size="23" font-weight="700" fill="#956522"><tspan x="1430" dy="0">中–高</tspan></text><text x="1425" y="698" font-size="16" font-weight="400" fill="#586B7A"><tspan x="1425" dy="0">光纤中</tspan><tspan x="1425" dy="20.48">定制高</tspan></text><rect x="64" y="720" width="1472" height="1" fill="#D7E0E8"/><text x="64" y="767" font-size="23" font-weight="700" fill="#15324F"><tspan x="64" dy="0">采购动作</tspan></text><text x="204" y="768" font-size="22" font-weight="700" fill="#2166A5"><tspan x="204" dy="0">光源：提前借样验证</tspan></text><text x="570" y="768" font-size="22" font-weight="700" fill="#2166A5"><tspan x="570" dy="0">光学件：加工 / 镀膜 / 检测联合评审</tspan></text><text x="1070" y="768" font-size="22" font-weight="700" fill="#2166A5"><tspan x="1070" dy="0">光栅：关键样片 → 全尺寸首件</tspan></text><text x="64" y="819" font-size="18" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">工程预筛：实际价格、交期、第二来源及量产能力，需通过询价（RFQ）、首件与供应商审核确认。</tspan><tspan x="64" dy="23.04">高亮度UV路线为高；氘灯系统为中。来源：component_risk_matrix.md；官方证据 [C01–C24]。</tspan></text></svg>