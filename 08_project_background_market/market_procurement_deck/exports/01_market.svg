<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Source Han Sans SC",sans-serif}</style><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="64" y="55" width="8" height="45" fill="#2166A5"/><text x="92" y="86" font-size="38" font-weight="700" fill="#15324F"><tspan x="92" dy="0">LS 需求随光刻整机产生，价值在系统集成与准入</tspan></text><text x="64" y="143" font-size="24" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">商业机会由光刻设备需求、整机集成能力和客户验证共同决定。</tspan></text><text x="1470" y="867" font-size="18" font-weight="400" fill="#586B7A"><tspan x="1470" dy="0">01</tspan></text><text x="64" y="217" font-size="26" font-weight="700" fill="#15324F"><tspan x="64" dy="0">需求传导</tspan></text><rect x="64" y="241" width="338" height="66" fill="#F2F5F8"/><text x="80" y="282" font-size="25" font-weight="700" fill="#15324F"><tspan x="80" dy="0">半导体制造需求</tspan></text><text x="409" y="283" font-size="26" font-weight="400" fill="#2166A5"><tspan x="409" dy="0">→</tspan></text><rect x="442" y="241" width="338" height="66" fill="#F2F5F8"/><text x="458" y="282" font-size="25" font-weight="700" fill="#15324F"><tspan x="458" dy="0">晶圆厂设备投资</tspan></text><text x="787" y="283" font-size="26" font-weight="400" fill="#2166A5"><tspan x="787" dy="0">→</tspan></text><rect x="820" y="241" width="338" height="66" fill="#F2F5F8"/><text x="836" y="282" font-size="25" font-weight="700" fill="#15324F"><tspan x="836" dy="0">光刻设备采购 / 升级</tspan></text><text x="1165" y="283" font-size="26" font-weight="400" fill="#2166A5"><tspan x="1165" dy="0">→</tspan></text><rect x="1198" y="241" width="338" height="66" fill="#E8F0F8"/><text x="1214" y="282" font-size="25" font-weight="700" fill="#15324F"><tspan x="1214" dy="0">LS 测高与调焦调平</tspan></text><text x="64" y="343" font-size="21" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">需求传导，并非固定比例换算。</tspan></text><text x="64" y="416" font-size="26" font-weight="700" fill="#15324F"><tspan x="64" dy="0">主要参与者｜按角色与应用区分</tspan></text><rect x="64" y="509" width="848" height="1" fill="#D7E0E8"/><text x="64" y="473" font-size="23" font-weight="700" fill="#15324F"><tspan x="64" dy="0">国际整机</tspan></text><text x="195" y="472" font-size="22" font-weight="400" fill="#243746"><tspan x="195" dy="0">ASML：EUV / DUV；Nikon：投影光刻；Canon：KrF / i-line等</tspan></text><rect x="64" y="579" width="848" height="1" fill="#D7E0E8"/><text x="64" y="543" font-size="23" font-weight="700" fill="#15324F"><tspan x="64" dy="0">国内整机</tspan></text><text x="195" y="542" font-size="22" font-weight="400" fill="#243746"><tspan x="195" dy="0">SMEE：公开 SSX600 调焦调平能力</tspan></text><rect x="64" y="649" width="848" height="1" fill="#D7E0E8"/><text x="64" y="613" font-size="23" font-weight="700" fill="#15324F"><tspan x="64" dy="0">上游光学</tspan></text><text x="195" y="612" font-size="22" font-weight="400" fill="#243746"><tspan x="195" dy="0">ZEISS：光刻光学能力；未确认整套 LS 供货关系</tspan></text><rect x="64" y="719" width="848" height="1" fill="#D7E0E8"/><text x="64" y="683" font-size="23" font-weight="700" fill="#15324F"><tspan x="64" dy="0">国内研发</tspan></text><text x="195" y="682" font-size="22" font-weight="400" fill="#243746"><tspan x="195" dy="0">中科院相关机构、高校：科研与联合研发角色</tspan></text><text x="64" y="761" font-size="20" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">不代表能力或份额对等；SMEE 销量与先进节点量产未披露。</tspan></text><rect x="950" y="390" width="2" height="395" fill="#D7E0E8"/><text x="990" y="414" font-size="24" font-weight="700" fill="#15324F"><tspan x="990" dy="0">公开需求代理｜不是 LS 市场规模</tspan></text><text x="990" y="463" font-size="23" font-weight="700" fill="#243746"><tspan x="990" dy="0">ASML 新光刻系统销量</tspan></text><text x="990" y="534" font-size="48" font-weight="700" fill="#2166A5"><tspan x="990" dy="0">380</tspan></text><text x="1248" y="534" font-size="48" font-weight="700" fill="#2166A5"><tspan x="1248" dy="0">300</tspan></text><text x="990" y="572" font-size="21" font-weight="400" fill="#586B7A"><tspan x="990" dy="0">2024 年 · 台</tspan></text><text x="1248" y="572" font-size="21" font-weight="400" fill="#586B7A"><tspan x="1248" dy="0">2025 年 · 台</tspan></text><text x="990" y="611" font-size="20" font-weight="400" fill="#586B7A"><tspan x="990" dy="0">单一厂商年度波动，不代表行业下滑。</tspan></text><rect x="990" y="637" width="546" height="1" fill="#D7E0E8"/><text x="990" y="681" font-size="22" font-weight="700" fill="#243746"><tspan x="990" dy="0">全球半导体设备销售额 billings</tspan></text><text x="990" y="736" font-size="36" font-weight="700" fill="#2166A5"><tspan x="990" dy="0">405.3 亿美元</tspan></text><text x="1310" y="733" font-size="27" font-weight="700" fill="#2166A5"><tspan x="1310" dy="0">同比 +23%</tspan></text><text x="990" y="778" font-size="20" font-weight="400" fill="#586B7A"><tspan x="990" dy="0">2026 Q2 · 全部设备 · 单季度，不年化</tspan></text><rect x="64" y="812" width="1472" height="1" fill="#D7E0E8"/><text x="64" y="848" font-size="18" font-weight="400" fill="#586B7A"><tspan x="64" dy="0">来源：ASML FY2025 [S01]；SEMI 2026Q2 [S02]；参与者 [S04–S11]。</tspan><tspan x="64" dy="23.04">光刻与 LS 未单列为该统计口径，不估算独立 LS TAM。</tspan></text></svg>