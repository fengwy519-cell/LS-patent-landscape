</defs>
<rect x="26" y="16" width="320" height="82" rx="10" fill="#EFF5FF" stroke="#BFD4F5" stroke-width="1.5"/>
<text x="186" y="52" font-size="20" fill="#111827" font-weight="700" text-anchor="middle">半导体制造需求</text>
<text x="186" y="78" font-size="15" fill="#64748B" font-weight="400" text-anchor="middle">产能与工艺升级</text>
<line x1="354" y1="57" x2="384" y2="57" stroke="#2563EB" stroke-width="2.2" marker-end="url(#pv30arrB)"/>
<rect x="392" y="16" width="320" height="82" rx="10" fill="#EFF5FF" stroke="#BFD4F5" stroke-width="1.5"/>
<text x="552" y="52" font-size="20" fill="#111827" font-weight="700" text-anchor="middle">晶圆厂设备投资</text>
<text x="552" y="78" font-size="15" fill="#64748B" font-weight="400" text-anchor="middle">资本开支与采购周期</text>
<line x1="720" y1="57" x2="750" y2="57" stroke="#2563EB" stroke-width="2.2" marker-end="url(#pv30arrB)"/>
<rect x="758" y="16" width="320" height="82" rx="10" fill="#EFF5FF" stroke="#BFD4F5" stroke-width="1.5"/>
<text x="918" y="52" font-size="20" fill="#111827" font-weight="700" text-anchor="middle">光刻设备采购 / 升级</text>
<text x="918" y="78" font-size="15" fill="#64748B" font-weight="400" text-anchor="middle">新机与存量改造</text>
<line x1="1086" y1="57" x2="1116" y2="57" stroke="#2563EB" stroke-width="2.2" marker-end="url(#pv30arrB)"/>
<rect x="1124" y="16" width="320" height="82" rx="10" fill="#ECFDF7" stroke="#0D9488" stroke-width="2.2"/>
<text x="1284" y="52" font-size="20" fill="#0F766E" font-weight="700" text-anchor="middle">LS 测高与调焦调平需求</text>
<text x="1284" y="78" font-size="15" fill="#64748B" font-weight="400" text-anchor="middle">本项目所处环节</text>
<text x="26" y="132" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">需求自上而下传导，不是固定比例换算：不能由设备投资金额或整机台数直接折算 LS 市场规模。</text></svg>
<svg x="64" y="354" width="1472" height="320" viewBox="0 0 1472 320"><defs>
  <marker id="pv31arrB" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563EB"/></marker>
