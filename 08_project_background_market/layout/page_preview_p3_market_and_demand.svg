  <marker id="pv32arrT" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0D9488"/></marker>
  <marker id="pv32arrG" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/></marker>
  <marker id="pv32arrA" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B45309"/></marker>
  <marker id="pv32arrO" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#EA580C"/></marker>
  <marker id="pv32dotB" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5"><circle cx="3.5" cy="3.5" r="3" fill="#2563EB"/></marker>
</defs>
<rect x="26" y="8" width="1420" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<line x1="736" y1="20" x2="736" y2="116" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="52" y="34" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="start">M1 · ASML 新光刻系统销量（全球 · 年度）</text>
<text x="52" y="80" font-size="16" fill="#334155" font-weight="400" text-anchor="start"><tspan fill="#111827" font-size="32" font-weight="700">380</tspan><tspan fill="#64748B" font-size="16" dx="6">台（2024）</tspan><tspan fill="#111827" font-size="32" font-weight="700" dx="46">300</tspan><tspan fill="#64748B" font-size="16" dx="6">台（2025）</tspan></text>
<text x="52" y="108" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">单一整机厂商新机数量；年度波动不代表行业趋势，也不等于 LS 套数。[S01]</text>
<text x="762" y="34" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="start">M2 · 全球半导体设备销售额 billings（全部设备 · 单季度）</text>
<text x="762" y="80" font-size="16" fill="#334155" font-weight="400" text-anchor="start"><tspan fill="#111827" font-size="32" font-weight="700">405.3</tspan><tspan fill="#64748B" font-size="16" dx="6">亿美元</tspan><tspan fill="#334155" font-size="16" dx="46">2026 Q2 · 同比 +23%</tspan></text>
<text x="762" y="108" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">涵盖全部半导体设备，不是光刻或 LS 市场规模；季度数据不年化。[S02]</text></svg>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#E2E8F0" stroke-width="1"/>
<text x="64" y="872" font-size="14" fill="#94A3B8" font-weight="400" text-anchor="start">公开资料未提供可核验的独立 LS 市场规模，本页采用整机销量与行业设备景气作为需求代理。M1、M2 口径不同，不相加、不共用坐标轴。[S01, S02]</text>
</svg>
