<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="64" y="44" width="5" height="40" rx="2.5" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="84" y="78" font-size="40" fill="#111827" font-weight="700" text-anchor="start">市场与需求</text>
<text x="1536" y="76" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end">市场 · 3 / 3</text>
<line x1="64" y1="100" x2="1536" y2="100" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="64" y="152" font-size="22" fill="#1D4ED8" font-weight="700" text-anchor="start">LS 需求随光刻整机产生；公开资料没有可核验的独立 LS 市场规模，商业机会取决于工艺适应、长期稳定与整机验证。</text>
