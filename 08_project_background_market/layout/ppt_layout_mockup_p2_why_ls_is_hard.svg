<text x="132" y="50" font-size="28" fill="#111827" font-weight="700" text-anchor="start">Page 2 ｜ LS 为什么难</text>
<text x="132" y="82" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">PPT 排版示意 · 16:9 · 1600 × 900 px · 背景 · 2 / 3 · BACKGROUND-MARKET-CONTENT-FROZEN-v1</text>
