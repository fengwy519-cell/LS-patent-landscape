<text x="84" y="78" font-size="40" fill="#111827" font-weight="700" text-anchor="start">LS 为什么难</text>
<text x="1536" y="76" font-size="16" fill="#94A3B8" font-weight="400" text-anchor="end">背景 · 2 / 3</text>
<line x1="64" y1="100" x2="1536" y2="100" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="64" y="152" font-size="22" fill="#1D4ED8" font-weight="700" text-anchor="start">难点不是“能不能测到高度”，而是在复杂工艺与高速曝光下，持续输出可信、稳定、可用于曝光控制的晶圆面形。</text>
