<text x="26" y="30" font-size="17" fill="#111827" font-weight="700" text-anchor="start">谁在参与 · 按公开可确认的角色划分</text>
<rect x="26" y="46" width="214" height="58" rx="8" fill="#EFF5FF" stroke="#BFD4F5" stroke-width="1.2"/>
<text x="133" y="71" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="middle">整机 / 系统集成</text>
<text x="133" y="91" font-size="14" fill="#1D4ED8" font-weight="400" text-anchor="middle">（国际）</text>
<text x="254" y="72" font-size="20" fill="#111827" font-weight="700" text-anchor="start">ASML · Nikon · Canon</text>
<text x="254" y="94" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">DUV / EUV 等整机承载测高与曝光控制需求</text>
<rect x="26" y="111" width="214" height="58" rx="8" fill="#EFF5FF" stroke="#BFD4F5" stroke-width="1.2"/>
<text x="133" y="136" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="middle">整机 / 系统集成</text>
<text x="133" y="156" font-size="14" fill="#1D4ED8" font-weight="400" text-anchor="middle">（国内）</text>
<text x="254" y="137" font-size="20" fill="#111827" font-weight="700" text-anchor="start">SMEE</text>
<text x="254" y="159" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">公开披露 SSX600 工艺自适应调焦调平能力；销量与先进节点量产未披露</text>
<rect x="26" y="176" width="214" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="133" y="212" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">上游光学器件</text>
<text x="254" y="202" font-size="20" fill="#111827" font-weight="700" text-anchor="start">ZEISS</text>
<text x="254" y="224" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">公开的光刻光学与光学系统能力；未确认整套 LS 供货关系</text>
<rect x="26" y="241" width="214" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="133" y="277" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">国内研究力量</text>
<text x="254" y="267" font-size="20" fill="#111827" font-weight="700" text-anchor="start">中科院相关机构 · 高校等</text>
<text x="254" y="289" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">科研与联合研发角色，不等于成熟商业供应商</text>
<line x1="838" y1="14" x2="838" y2="300" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="866" y="30" font-size="17" fill="#111827" font-weight="700" text-anchor="start">为什么难进入 · 3 道壁垒</text>
<rect x="866" y="46" width="580" height="76" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="866" y="46" width="5" height="76" rx="2.5" fill="#0D9488" stroke="none" stroke-width="1"/>
<circle cx="906" cy="84" r="15" fill="#0D9488" stroke="none" stroke-width="1"/><text x="906" y="89.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="936" y="78" font-size="19" fill="#111827" font-weight="700" text-anchor="start">工艺适应</text>
<text x="936" y="104" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">不同膜系与图形下都要给出可信高度</text>
<rect x="866" y="134" width="580" height="76" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="866" y="134" width="5" height="76" rx="2.5" fill="#0D9488" stroke="none" stroke-width="1"/>
<circle cx="906" cy="172" r="15" fill="#0D9488" stroke="none" stroke-width="1"/><text x="906" y="177.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="936" y="166" font-size="19" fill="#111827" font-weight="700" text-anchor="start">长期稳定与标定</text>
<text x="936" y="192" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">多通道一致性与漂移必须长期可控</text>
<rect x="866" y="222" width="580" height="76" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="866" y="222" width="5" height="76" rx="2.5" fill="#0D9488" stroke="none" stroke-width="1"/>
<circle cx="906" cy="260" r="15" fill="#0D9488" stroke="none" stroke-width="1"/><text x="906" y="265.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="936" y="254" font-size="19" fill="#111827" font-weight="700" text-anchor="start">平台控制与整机验证</text>
<text x="936" y="280" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">进入整机控制闭环并通过客户验证</text>
<text x="26" y="314" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">按公开可确认角色分类；不表示市场份额，不表示已确认供应关系，也不以专利数量代替份额。</text>
</svg>
