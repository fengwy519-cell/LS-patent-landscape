<text x="52" y="34" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="start">M1 · ASML 新光刻系统销量（全球 · 年度）</text>
<text x="52" y="80" font-size="16" fill="#334155" font-weight="400" text-anchor="start"><tspan fill="#111827" font-size="32" font-weight="700">380</tspan><tspan fill="#64748B" font-size="16" dx="6">台（2024）</tspan><tspan fill="#111827" font-size="32" font-weight="700" dx="46">300</tspan><tspan fill="#64748B" font-size="16" dx="6">台（2025）</tspan></text>
<text x="52" y="108" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">单一整机厂商新机数量；年度波动不代表行业趋势，也不等于 LS 套数。[S01]</text>
<text x="762" y="34" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="start">M2 · 全球半导体设备销售额 billings（全部设备 · 单季度）</text>
<text x="762" y="80" font-size="16" fill="#334155" font-weight="400" text-anchor="start"><tspan fill="#111827" font-size="32" font-weight="700">405.3</tspan><tspan fill="#64748B" font-size="16" dx="6">亿美元</tspan><tspan fill="#334155" font-size="16" dx="46">2026 Q2 · 同比 +23%</tspan></text>
<text x="762" y="108" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">涵盖全部半导体设备，不是光刻或 LS 市场规模；季度数据不年化。[S02]</text>
