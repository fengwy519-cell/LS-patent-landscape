<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
<rect width="1500" height="600" fill="#FFFFFF"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <style><![CDATA[
    text { font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Arial',sans-serif; }
    .title { font-size:30px; font-weight:700; fill:#1F2937; }
    .label { font-size:23px; font-weight:700; fill:#1F2937; }
    .small { font-size:18px; fill:#667085; }
    .tiny { font-size:15px; fill:#667085; }
  ]]></style>
</defs>
<!-- stage labels -->
<text x="65" y="58" class="small">测量</text><text x="565" y="58" class="small">解算</text><text x="925" y="58" class="small">控制</text>
<line x1="55" y1="72" x2="1445" y2="72" stroke="#CBD5E1" stroke-width="2"/>
<!-- optical measurement module -->
<rect x="55" y="120" width="440" height="300" rx="28" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="85" y="163" class="label">光学测高</text>
<text x="85" y="193" class="small">斜入射图案 → 晶圆反射 → 接收信号</text>
<!-- simplified geometry -->
<line x1="115" y1="280" x2="220" y2="230" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<ellipse cx="290" cy="330" rx="125" ry="35" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<path d="M175 330 Q290 287 405 330" fill="none" stroke="#0F8FA8" stroke-width="4"/>
<line x1="300" y1="270" x2="405" y2="225" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="104" y="245" class="tiny">投影</text><text x="392" y="210" class="tiny">接收</text><text x="250" y="390" class="tiny">晶圆表面高度变化</text>
<!-- chain modules -->
<rect x="545" y="160" width="200" height="150" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<text x="645" y="218" text-anchor="middle" class="label">高度解算</text><text x="645" y="252" text-anchor="middle" class="small">信号 → 高度</text>
<rect x="795" y="160" width="210" height="150" rx="22" fill="#FFFFFF" stroke="#0F8FA8" stroke-width="2.5"/>
<text x="900" y="218" text-anchor="middle" class="label">面形重建</text><text x="900" y="252" text-anchor="middle" class="small">坐标 + 时间</text>
<rect x="1055" y="160" width="200" height="150" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<text x="1155" y="218" text-anchor="middle" class="label">调焦调平</text><text x="1155" y="252" text-anchor="middle" class="small">控制器生成补偿</text>
<rect x="1305" y="160" width="140" height="150" rx="22" fill="#2563EB"/>
<text x="1375" y="218" text-anchor="middle" class="label" style="fill:#FFFFFF">曝光控制</text><text x="1375" y="252" text-anchor="middle" class="small" style="fill:#EAF2FF">残余离焦</text><text x="1375" y="278" text-anchor="middle" class="small" style="fill:#EAF2FF">满足允许范围</text>
<!-- arrows -->
<line x1="495" y1="235" x2="535" y2="235" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="745" y1="235" x2="785" y2="235" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1005" y1="235" x2="1045" y2="235" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1255" y1="235" x2="1295" y2="235" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
<!-- auxiliary inputs -->
<rect x="560" y="365" width="170" height="70" rx="16" fill="#F1F5F9"/>
<text x="645" y="408" text-anchor="middle" class="small">标定 / 工艺补偿</text>
<line x1="645" y1="365" x2="645" y2="320" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowGray)"/>
<rect x="1060" y="365" width="190" height="70" rx="16" fill="#F1F5F9"/>
<text x="1155" y="408" text-anchor="middle" class="small">最佳焦面基准</text>
<line x1="1155" y1="365" x2="1155" y2="320" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowGray)"/>
<!-- boundary note -->
<path d="M1055 485 H1445" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="1250" y="525" text-anchor="middle" class="small">LS 提供测量信息；平台动作由整机控制链执行</text>

</svg>